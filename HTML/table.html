<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABES Engineering College</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      background-color: #fff;
      padding: 10px 0;
      border-bottom: 3px solid maroon;
    }

    header img {
      height: 80px;
    }

    header h1 {
      margin: 5px 0;
      font-size: 36px;
      color: #222;
    }

    header h2 {
      margin: 0;
      font-size: 20px;
      color: maroon;
    }

    nav {
      background-color: #b02a30;
      text-align: center;
    }

    nav a {
      display: inline-block;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      font-weight: bold;
    }

    nav a:hover {
      background-color: #8a1f25;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }

    footer {
      background-color: #222;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/en/1/1d/ABES_Engineering_College_logo.png" alt="ABES Logo">
    <h1>ABES Engineering College</h1>
    <h2>College Code: 032 | Estd. 2000</h2>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About Us</a>
    <a href="#">Admission</a>
    <a href="#">Gallery</a>
    <a href="#">Notice Board</a>
    <a href="#">Events</a>
    <a href="#">Tutorial</a>
    <a href="#">Contact Us</a>
  </nav>

  <section class="gallery">
    <img src="https://source.unsplash.com/600x400/?students,campus" alt="Campus 1">
    <img src="https://source.unsplash.com/600x400/?college,library" alt="Library">
    <img src="https://source.unsplash.com/600x400/?education,group" alt="Group Study">
    <img src="https://source.unsplash.com/600x400/?university,garden" alt="Garden">
    <img src="https://source.unsplash.com/600x400/?students,classroom" alt="Classroom">
    <img src="https://source.unsplash.com/600x400/?books,reading" alt="Reading">
  </section>

  <footer>
    <p>&copy; 2025 ABES Engineering College. All rights reserved.</p>
  </footer>
</body>
</html>
